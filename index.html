<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEORAB</title>
    <style>
        /* 1. 기본 설정 (다크모드 시 레터박스 색상 전환) */
        body { margin: 0; padding: 0; background-color: #ffffff; width: 100vw; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: 'Malgun Gothic', sans-serif; transition: background-color 0.3s ease; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        .d-none { display: none !important; }
        .click-zone { position: absolute; z-index: 999; cursor: pointer; background: transparent; }

        /* =========================================
           [팝업창 공통 디자인]
           ========================================= */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; display: flex; justify-content: center; align-items: center; }
        .popup-content { background: #1a1a1a; padding: 40px 30px; text-align: center; color: white; border-radius: 10px; max-width: 400px; box-shadow: 0 0 30px rgba(255, 255, 255, 0.1); border: 2px solid #555; }
        .popup-content h2 { margin-top: 0; margin-bottom: 20px; }
        .popup-content p { line-height: 1.6; color: #ccc; margin-bottom: 30px; word-break: keep-all; font-weight: bold;}
        .btn-close { display: block; margin: 20px auto 0; background: none; color: #888; border: none; text-decoration: underline; cursor: pointer; font-size: 14px; }
        .btn-close:hover { color: white; }

        /* 개별 팝업 포인트 컬러 */
        #secret-popup .popup-content { border-color: #ff4444; box-shadow: 0 0 30px rgba(255, 68, 68, 0.4); }
        #secret-popup h2 { color: #ff4444; }
        .btn-sns { display: inline-block; background: #ff4444; color: white; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 5px; transition: 0.2s; }
        .btn-sns:hover { background: #ff6666; }

        #card-popup .popup-content { border-color: #44aa44; box-shadow: 0 0 30px rgba(68, 170, 68, 0.4); }
        #card-popup h2 { color: #44aa44; }

        #cog-popup .popup-content { border-color: #aaaaaa; box-shadow: 0 0 30px rgba(170, 170, 170, 0.4); }
        #cog-popup h2 { color: #aaaaaa; }


        /* =========================================
           [PC 세상]
           ========================================= */
        #pc-stage { position: relative; width: 100%; height: 100%; max-width: 177.78vh; aspect-ratio: 16 / 9; background-color: #ffffff; display: block; transition: background-color 0.3s ease; }
        #bg { z-index: 1; } 
        #drawer-closed { z-index: 5; } #drawer-open { z-index: 6; } 
        #cabinet-default { z-index: 10; } #cabinet-cutout { z-index: 10; } #cabinet-open { z-index: 11; }
        #dark-bg { z-index: 50; } 
        #dark-sticker-img { z-index: 51; opacity: 0; transition: opacity 1.5s ease-in-out; }
        #dark-sticker-img.glow-on { opacity: 1; }
        #switch-on, #switch-off { z-index: 100; } 
        
        #zone-switch { top: 2.59%; left: 42.68%; width: 1.60%; height: 5.61%; }
        #zone-cabinet { top: 39.67%; left: 44.00%; width: 13.65%; height: 11.80%; }
        #zone-drawer { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(32.32% 76.56%, 44.01% 60.96%, 44.29% 65.55%, 33.21% 80.14%); }
        #zone-box { width: 15%; height: 25%; top: 50%; right: 0; } 
        #zone-sticker { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(44.99% 63.02%, 56.54% 63.28%, 55.86% 70.65%, 45.28% 70.13%); z-index: 999; }

        /* ★ PC 명함 & 톱니 (서랍(999)보다 높은 1000으로 배치) */
        #zone-card { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(36.89% 74.03%, 41.09% 72.03%, 41.87% 76.02%, 37.62% 78.19%); z-index: 1000; }
        #zone-cog { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(41.28% 67.87%, 42.16% 74.29%, 45.82% 71.95%, 44.99% 66.40%); z-index: 1000; }


        /* =========================================
           [모바일 세상]
           ========================================= */
        #mobile-stage { 
            position: relative; background-color: #ffffff; display: none; 
            width: min(100vw, calc(100dvh * (9 / 19.5))); height: min(100dvh, calc(100vw * (19.5 / 9))); 
            box-shadow: none; transition: background-color 0.3s ease; 
        }
        .m-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        #m-bg { z-index: 1; } #m-poster, #m-schedule, #m-box { z-index: 2; }
        #m-drawer-default { z-index: 5; } #m-drawer-open { z-index: 6; }
        #m-cabinet-default { z-index: 10; } #m-cabinet-cutout { z-index: 10; } #m-cabinet-open { z-index: 11; }
        #m-dark-bg { z-index: 50; } #m-dark-sticker-img { z-index: 51; opacity: 0; transition: opacity 1.5s ease-in-out; }
        #m-dark-sticker-img.glow-on { opacity: 1; }
        #m-switch-on, #m-switch-off { z-index: 100; }

        #zone-m-switch { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(49.38% 20.60%, 49.98% 24.23%, 53.41% 24.23%, 53.21% 21.07%); }
        #zone-m-drawer { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(25.38% 66.03%, 27.80% 68.63%, 55.43% 58.86%, 55.23% 55.97%); }
        #zone-m-cabinet { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(54.22% 42.48%, 55.23% 49.37%, 89.51% 49.46%, 91.73% 42.48%); }
        #zone-m-poster { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(6.82% 20.14%, 23.97% 35.59%, 49.58% 36.15%, 33.44% 16.23%); }
        #zone-m-schedule { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(62.49% 9.34%, 63.29% 24.98%, 99.60% 28.89%, 99.60% 10.18%); }
        #zone-m-box { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(63.50% 67.98%, 29.41% 86.88%, 68.74% 99.07%, 98.59% 73.47%); }
        #zone-m-sticker { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(57.47% 56.75%, 87.04% 57.17%, 84.98% 61.93%, 58.62% 61.61%); z-index: 999; }

        /* ★ 모바일 명함 & 톱니 (z-index 1000) */
        #zone-m-card { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(35.46% 63.51%, 38.69% 68.08%, 50.99% 65.75%, 46.96% 61.75%); z-index: 1000; }
        #zone-m-cog { width: 100%; height: 100%; top: 0; left: 0; clip-path: polygon(46.55% 60.16%, 50.99% 64.91%, 60.27% 62.49%, 57.24% 58.21%); z-index: 1000; }

        @media (max-width: 768px) { #pc-stage { display: none !important; } #mobile-stage { display: block !important; } }
    </style>
</head>
<body>

    <div id="secret-popup" class="d-none popup-overlay">
        <div class="popup-content">
            <h2>⚠️ 열 람 주 의 ⚠️</h2>
            <p>R-18 이상 전용 작품관.<br>입장에 주의 요망</p>
            <a href="https://twitter.com/" target="_blank" class="btn-sns">다락 SNS로 이동하기</a>
            <button onclick="closePopup('secret-popup')" class="btn-close">닫기</button>
        </div>
    </div>

    <div id="card-popup" class="d-none popup-overlay">
        <div class="popup-content">
            <h2>📇 서랍(SEORAB) 정보</h2>
            <p>
                설립 연도: 2026년<br>
                크리에이티브 크루 서랍입니다.<br>
                연락처: seorab@example.com
            </p>
            <button onclick="closePopup('card-popup')" class="btn-close">닫기</button>
        </div>
    </div>

<div id="cog-popup" class="d-none popup-overlay">
        <div class="popup-content">
            <h2>⚙️ 시 스 템 설 정</h2>
            
            <div style="text-align: left; background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <p style="margin-top: 0; font-weight: normal; font-size: 14px;">
                    <b>버전:</b> v1.0.0 (Beta)<br>
                    <b>업데이트:</b> 2026.02.20
                </p>
                
                <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
                
                <div style="margin-bottom: 5px;">
                    <b>🌐 언어 설정 (Language)</b>
                </div>
                <select id="lang-select" style="width: 100%; padding: 10px; background: #333; color: white; border: 1px solid #666; border-radius: 5px; font-family: 'Malgun Gothic', sans-serif; cursor: pointer;">
                    <option value="ko">한국어 (Korean)</option>
                    <option value="en">English (준비중)</option>
                    <option value="ja">日本語 (준비중)</option>
                </select>
            </div>

            <button onclick="clickHelp()" class="btn-sns" style="width: 100%; background: #555; margin-bottom: 10px;">💡 도움말 보기</button>
            
            <button onclick="closePopup('cog-popup')" class="btn-close">닫기</button>
        </div>
    </div>


    <div id="pc-stage">
        <img src="main.png" class="layer" id="bg">
        <img src="left_drawer_default.png" class="layer" id="drawer-closed">
        <img src="left_drawer_open.png" class="layer d-none" id="drawer-open">
        <img src="center_cabinet_default.png" class="layer" id="cabinet-default">
        <img src="center_cabinet_cutout.png" class="layer d-none" id="cabinet-cutout">
        <img src="center_cabinet_open.png" class="layer d-none" id="cabinet-open">
        
        <img src="dark_main.png" class="layer d-none" id="dark-bg">
        <img src="dark_sticker.png" class="layer" id="dark-sticker-img">
        <img src="switch_on.png" class="layer" id="switch-on">
        <img src="switch_off.png" class="layer d-none" id="switch-off">

        <div class="click-zone" id="zone-switch" onclick="clickSwitch()"></div>
        <div class="click-zone" id="zone-drawer" onclick="clickDrawer()"></div>
        <div class="click-zone" id="zone-cabinet" onclick="clickCabinet()"></div>
        <div class="click-zone" id="zone-box" onclick="clickBox()"></div>
        <div class="click-zone d-none" id="zone-sticker" onclick="clickSticker(event)"></div>
        
        <div class="click-zone d-none" id="zone-card" onclick="clickCard(event)"></div>
        <div class="click-zone d-none" id="zone-cog" onclick="clickCog(event)"></div>
    </div>

    <div id="mobile-stage">
        <img src="m_bg.png" class="m-layer" id="m-bg">
        <img src="m_poster.png" class="m-layer" id="m-poster">
        <img src="m_schedule.png" class="m-layer" id="m-schedule">
        <img src="m_box.png" class="m-layer d-none" id="m-box">
        <img src="m_drawer_default.png" class="m-layer" id="m-drawer-default">
        <img src="m_drawer_open.png" class="m-layer d-none" id="m-drawer-open">
        <img src="m_cabinet_default.png" class="m-layer" id="m-cabinet-default">
        <img src="m_cabinet_cutout.png" class="m-layer d-none" id="m-cabinet-cutout">
        <img src="m_cabinet_open.png" class="m-layer d-none" id="m-cabinet-open">
        
        <img src="m_dark_main.png" class="m-layer d-none" id="m-dark-bg">
        <img src="m_dark_sticker.png" class="m-layer" id="m-dark-sticker-img">
        <img src="m_switch_on.png" class="m-layer" id="m-switch-on">
        <img src="m_switch_off.png" class="m-layer d-none" id="m-switch-off">

        <div class="click-zone" id="zone-m-switch" onclick="clickSwitch()"></div>
        <div class="click-zone" id="zone-m-drawer" onclick="clickDrawer()"></div>
        <div class="click-zone" id="zone-m-cabinet" onclick="clickCabinet()"></div>
        <div class="click-zone" id="zone-m-poster" onclick="clickPoster()"></div>
        <div class="click-zone" id="zone-m-schedule" onclick="clickSchedule()"></div>
        <div class="click-zone" id="zone-m-box" onclick="clickBox()"></div>
        <div class="click-zone d-none" id="zone-m-sticker" onclick="clickSticker(event)"></div>

        <div class="click-zone d-none" id="zone-m-card" onclick="clickCard(event)"></div>
        <div class="click-zone d-none" id="zone-m-cog" onclick="clickCog(event)"></div>
    </div>

    <script>
        let state = { dark: false, drawer: false, cabinet: false };

        function clickSwitch() { state.dark = !state.dark; updateView(); }
        function clickDrawer() {
            if (state.dark) return; 
            if (state.drawer) state.drawer = false;
            else { state.drawer = true; state.cabinet = false; }
            updateView();
        }
        function clickCabinet() {
            if (state.dark) return; 
            if (state.cabinet) state.cabinet = false;
            else { state.cabinet = true; state.drawer = false; }
            updateView();
        }

        // === 팝업 컨트롤 통합 함수 (미스터치 방지 마법 적용!) ===
        function clickSticker(e) { 
            if(e) e.stopPropagation(); 
            document.getElementById('secret-popup').classList.remove('d-none'); 
        }
        function clickCard(e) { 
            if(e) e.stopPropagation(); // 아래 깔린 서랍이 눌리는 걸 막아줍니다!
            document.getElementById('card-popup').classList.remove('d-none'); 
        }
        function clickCog(e) { 
            if(e) e.stopPropagation(); // 아래 깔린 서랍이 눌리는 걸 막아줍니다!
            document.getElementById('cog-popup').classList.remove('d-none'); 
        }
        
        function closePopup(popupId) {
            document.getElementById(popupId).classList.add('d-none');
        }

        function clickPoster() { alert("행사 포스터입니다. (링크 연결 예정)"); }
        function clickSchedule() { alert("일정표 페이지로 이동합니다."); }
        function clickBox() { alert("통신판매 페이지로 이동합니다."); }

        function updateView() {
            const pc_stage = document.getElementById('pc-stage');
            const d_open = document.getElementById('drawer-open');
            const c_default = document.getElementById('cabinet-default');
            const c_cutout = document.getElementById('cabinet-cutout');
            const c_open = document.getElementById('cabinet-open');
            const s_on = document.getElementById('switch-on');
            const s_off = document.getElementById('switch-off');
            const dark_bg = document.getElementById('dark-bg');
            const dark_sticker_img = document.getElementById('dark-sticker-img');
            const zone_sticker = document.getElementById('zone-sticker');
            
            const zone_card = document.getElementById('zone-card');
            const zone_cog = document.getElementById('zone-cog');

            const mobile_stage = document.getElementById('mobile-stage');
            const m_d_open = document.getElementById('m-drawer-open');
            const m_c_default = document.getElementById('m-cabinet-default');
            const m_c_cutout = document.getElementById('m-cabinet-cutout');
            const m_c_open = document.getElementById('m-cabinet-open');
            const m_s_on = document.getElementById('m-switch-on');
            const m_s_off = document.getElementById('m-switch-off');
            const m_dark_bg = document.getElementById('m-dark-bg');
            const m_dark_sticker_img = document.getElementById('m-dark-sticker-img');
            const zone_m_sticker = document.getElementById('zone-m-sticker');
            
            const zone_m_card = document.getElementById('zone-m-card');
            const zone_m_cog = document.getElementById('zone-m-cog');

            // 1. 다크모드
            if (state.dark) {
                s_on.classList.add('d-none'); s_off.classList.remove('d-none');
                dark_bg.classList.remove('d-none'); zone_sticker.classList.remove('d-none'); 
                pc_stage.style.backgroundColor = "#444444"; dark_sticker_img.classList.add('glow-on'); 
                
                m_s_on.classList.add('d-none'); m_s_off.classList.remove('d-none');
                m_dark_bg.classList.remove('d-none'); zone_m_sticker.classList.remove('d-none');
                mobile_stage.style.backgroundColor = "#444444"; m_dark_sticker_img.classList.add('glow-on');

                document.body.style.backgroundColor = "#000000"; 
            } else {
                s_off.classList.add('d-none'); s_on.classList.remove('d-none');
                dark_bg.classList.add('d-none'); zone_sticker.classList.add('d-none'); 
                pc_stage.style.backgroundColor = "#ffffff"; dark_sticker_img.classList.remove('glow-on'); 
                
                m_s_off.classList.add('d-none'); m_s_on.classList.remove('d-none');
                m_dark_bg.classList.add('d-none'); zone_m_sticker.classList.add('d-none');
                mobile_stage.style.backgroundColor = "#ffffff"; m_dark_sticker_img.classList.remove('glow-on');

                document.body.style.backgroundColor = "#ffffff"; 
            }

            // 2. 왼쪽 서랍
            if (state.drawer) {
                d_open.classList.remove('d-none'); m_d_open.classList.remove('d-none');
                
                if(!state.dark) {
                    zone_card.classList.remove('d-none'); zone_cog.classList.remove('d-none');
                    zone_m_card.classList.remove('d-none'); zone_m_cog.classList.remove('d-none');
                } else {
                    zone_card.classList.add('d-none'); zone_cog.classList.add('d-none');
                    zone_m_card.classList.add('d-none'); zone_m_cog.classList.add('d-none');
                }
            } else {
                d_open.classList.add('d-none'); m_d_open.classList.add('d-none');
                zone_card.classList.add('d-none'); zone_cog.classList.add('d-none');
                zone_m_card.classList.add('d-none'); zone_m_cog.classList.add('d-none');
            }

            // 3. 캐비닛
            c_default.classList.add('d-none'); c_cutout.classList.add('d-none'); c_open.classList.add('d-none');
            m_c_default.classList.add('d-none'); m_c_cutout.classList.add('d-none'); m_c_open.classList.add('d-none');

            if (state.cabinet) {
                c_default.classList.remove('d-none'); c_open.classList.remove('d-none');
                m_c_default.classList.remove('d-none'); m_c_open.classList.remove('d-none');
            } else {
                if (state.drawer) {
                    c_cutout.classList.remove('d-none'); m_c_cutout.classList.remove('d-none');
                } else {
                    c_default.classList.remove('d-none'); m_c_default.classList.remove('d-none');
                }
            }
        }
        
        updateView();

        // 도움말 버튼 눌렀을 때 실행될 함수
        function clickHelp() {
            // 일단 팝업은 닫고
            closePopup('cog-popup');
            
            // 여기에 나중에 "도움말 오버레이"를 띄우는 기능을 넣을 겁니다!
            alert("도움말 기능이 실행됩니다! (어디를 누를 수 있는지 깜빡거리는 힌트 등 준비 중)");
        }

    </script>
</body>
</html>
