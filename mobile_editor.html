<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEORAB - MOBILE DARK EDITOR</title>
    <style>
        body { background-color: #222; margin: 0; width: 100vw; height: 100vh; overflow: hidden; display: flex; font-family: sans-serif; }
        
        #panel { width: 300px; background: #111; color: #eee; padding: 20px; border-right: 1px solid #444; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        h3 { margin: 0 0 10px 0; color: cyan; }
        button { padding: 10px; cursor: pointer; border: 1px solid #555; background: #333; color: white; text-align: left; }
        button.active { background: cyan; color: black; font-weight: bold; border-color: cyan; pointer-events: none;}
        textarea { width: 100%; height: 200px; background: #000; color: #0f0; border: 1px solid #555; font-size: 12px; margin-top: auto; }

        #stage-wrap { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #333; position: relative; padding: 20px;}
        
        #mobile-stage {
            position: relative;
            height: 90vh; 
            aspect-ratio: 9 / 19.5; /* 아이폰 비율 */
            background-color: #000; 
            box-shadow: 0 0 20px black;
            cursor: crosshair; 
            user-select: none;
        }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .dot { position: absolute; width: 6px; height: 6px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 9999; border: 1px solid white; }
        .polygon-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 255, 255, 0.4); border: 1px solid rgba(0, 255, 255, 0.8); pointer-events: none; }
    </style>
</head>
<body>
    <div id="panel">
        <h3>📍 모바일 야광 스티커 에디터</h3>
        <p>화면에 보이는 <strong>m_dark_main.png</strong>에서 야광 스티커의 <strong>꼭짓점 4개</strong>를 순서대로 클릭하세요.</p>
        <button class="active">모바일 야광 스티커</button>
        <button onclick="resetCurrent()" style="background: #552222; margin-top: 20px;">↺ 다시 찍기</button>
        <button onclick="generateCode()" style="background: #225522; margin-top:10px;">💾 코드 생성</button>
        <textarea id="output" readonly>좌표 4개를 다 찍고 [코드 생성]을 누르세요.</textarea>
    </div>

    <div id="stage-wrap">
        <div id="mobile-stage" onclick="handleStageClick(event)">
            <img src="m_dark_main.png" class="layer" id="bg">
            <div id="polygon-layer"></div>
        </div>
    </div>

    <script>
        let points = [];
        function handleStageClick(e) {
            if (points.length >= 4) { alert("이미 4개를 다 찍었습니다!"); return; }
            const stage = document.getElementById('mobile-stage');
            const rect = stage.getBoundingClientRect();
            const perX = (((e.clientX - rect.left) / rect.width) * 100).toFixed(2);
            const perY = (((e.clientY - rect.top) / rect.height) * 100).toFixed(2);
            points.push({ x: perX, y: perY });
            updateDots();
            if (points.length === 4) savePolygon();
        }
        function updateDots() {
            document.querySelectorAll('.dot').forEach(d => d.remove());
            const stage = document.getElementById('mobile-stage');
            points.forEach(p => {
                const dot = document.createElement('div');
                dot.className = 'dot'; dot.style.left = p.x + '%'; dot.style.top = p.y + '%';
                stage.appendChild(dot);
            });
        }
        function savePolygon() {
            const polyStr = `polygon(${points[0].x}% ${points[0].y}%, ${points[1].x}% ${points[1].y}%, ${points[2].x}% ${points[2].y}%, ${points[3].x}% ${points[3].y}%)`;
            const zone = document.createElement('div');
            zone.id = `poly-sticker`; zone.className = 'polygon-zone'; zone.style.clipPath = polyStr;
            zone.innerHTML = `<span style="background:black; color:cyan; font-size:12px; font-weight:bold;">모바일 스티커</span>`;
            document.getElementById('polygon-layer').appendChild(zone);
        }
        function resetCurrent() {
            points = []; updateDots();
            const oldZone = document.getElementById(`poly-sticker`);
            if (oldZone) oldZone.remove();
        }
        function generateCode() {
            if(points.length < 4) return alert("아직 꼭짓점 4개를 다 안 찍으셨어요!");
            const polyStr = `polygon(${points[0].x}% ${points[0].y}%, ${points[1].x}% ${points[1].y}%, ${points[2].x}% ${points[2].y}%, ${points[3].x}% ${points[3].y}%)`;
            document.getElementById('output').value = `/* 모바일 야광 스티커 좌표 */\n#zone-m-sticker {\n    width: 100%; height: 100%; top: 0; left: 0;\n    clip-path: ${polyStr};\n    z-index: 999;\n}`;
        }
    </script>
</body>
</html>
